# 顶层 key 必须是节点名（launch 里的 name= / cpp 里的 node_name）
threeD_lidar_filter_pointcloud:
  ros__parameters:
    
    laser_frame: livox_frame

    scan_topic_left: /livox/lidar_192_168_1_135
    scan_topic_right: /livox/lidar_192_168_1_122
    new_scan_topic: /cloud_origin       # 未滤波原始点云，调试看
    
    filted_topic_3d: /cloud_slope_filtered # 滤波结果

  
    first_radius: 0.35 # 车体自身附近直接丢掉的半径 (m)

  
    voxel_leaf_size: 0.05 # 体素下采样边长 (m)
    sor_mean_k: 20        # 统计滤波近邻数
    sor_stddev_mul: 1.0   # 统计滤波标准差倍数
